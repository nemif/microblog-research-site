name: Research site CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate scientific artifacts
        run: python scripts/generate_results.py
      - name: Strict site validation
        run: mkdocs build --strict
      - name: Ensure expected content exists
        run: grep -q 'Исследование производительности' site/index.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish via official Pages mechanism
        id: deployment
        uses: actions/deploy-pages@v4
